name: backend tests

on:
  push:
    branches:
      - main
      - suhas/backend
  pull_request:
    branches:
      - main
      - suhas/backend

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt
          python -c "import importlib.util; assert importlib.util.find_spec('spiceypy') is None"

      - name: download SPICE kernels
        run: |
          python -m backend.setup_kernels

      - name: cache global terrain
        uses: actions/cache@v4
        with:
          path: backend/terrain/data/ldem_64_uint.tif
          key: global-lola-64-${{ hashFiles('backend/setup_terrain.py') }}

      - name: download global LOLA terrain
        run: python -m backend.setup_terrain

      - name: run tests
        run: python -m pytest -q
