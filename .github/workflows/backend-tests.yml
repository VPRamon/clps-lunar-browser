name: backend tests

on:
  push:
    branches:
      - main
      - suhas/backend
      - feat/siderust-evaluation
  pull_request:
    branches:
      - main
      - suhas/backend
      - feat/siderust-evaluation

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [spiceypy, siderust]
    env:
      ASTRO_BACKEND: ${{ matrix.engine }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: set up Rust for the temporary source build
        if: matrix.engine == 'siderust'
        uses: dtolnay/rust-toolchain@stable

      - name: install optional native engine (pinned development source)
        if: matrix.engine == 'siderust'
        run: pip install -r requirements-siderust.txt

      - name: download SPICE kernels
        run: |
          python -m backend.setup_kernels

      - name: cache global terrain
        uses: actions/cache@v4
        with:
          path: backend/terrain/data/ldem_64_uint.tif
          key: global-lola-64-${{ hashFiles('backend/setup_terrain.py') }}

      - name: download global LOLA terrain
        run: python -m backend.setup_terrain

      - name: run tests
        run: python -m pytest -q

      - name: run real-data demonstration and benchmark
        if: matrix.engine == 'siderust'
        run: |
          python -m examples.compare_siderust_spiceypy > demo.json
          python -m benchmarks.compare_astro_backends --runs 3 --output benchmark.json

      - name: save evaluation evidence
        if: matrix.engine == 'siderust'
        uses: actions/upload-artifact@v4
        with:
          name: siderust-evaluation
          path: |
            demo.json
            benchmark.json
